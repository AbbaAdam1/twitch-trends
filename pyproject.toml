[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-trends"
version = "0.1.0"
description = "Serverless AWS pipeline measuring how long new-game launch hype lasts on Twitch"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["aws-cdk-lib>=2.170", "boto3>=1.34", "constructs>=10", "pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
